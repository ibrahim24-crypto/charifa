<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Endless Love — For Charifa</title>
  <!-- Google Fonts: Lovers Quarrel (elegant handwritten style) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lovers+Quarrel&display=swap" rel="stylesheet">
  <!-- fallback fonts -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 10% 20%, #0a0718, #02010a);
      min-height: 100vh;
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      color: #f3eefc;
    }

    /* floating nebula orbs */
    .bg-orbs {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      mix-blend-mode: screen;
      animation: floatOrb 24s infinite alternate ease-in-out;
    }
    .orb--one {
      width: 580px;
      height: 580px;
      left: -15%;
      top: -20%;
      background: radial-gradient(circle, #ff7eb3, #ff3b7c, #b82b8b);
      opacity: 0.5;
    }
    .orb--two {
      width: 520px;
      height: 520px;
      right: -10%;
      bottom: 10%;
      background: radial-gradient(circle, #b55eff, #8152e6, #4b2e9e);
      opacity: 0.55;
      animation-duration: 28s;
    }
    .orb--three {
      width: 440px;
      height: 440px;
      left: 25%;
      bottom: -20%;
      background: radial-gradient(circle, #1feffb, #4b6eff, #7a56ff);
      opacity: 0.4;
      animation-duration: 20s;
    }
    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(5%, 8%) scale(1.08); }
    }

    canvas#particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .stage {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* main glass card — ultra premium, no controls */
    .card {
      width: min(880px, 94vw);
      background: rgba(15, 12, 32, 0.45);
      backdrop-filter: blur(16px) saturate(180%);
      border-radius: 3rem;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 30px 55px rgba(0, 0, 0, 0.4), 0 0 0 0.5px rgba(255, 255, 255, 0.05) inset;
      padding: 2rem 1.5rem 2rem 1.5rem;
      text-align: center;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .title {
      font-family: 'Lovers Quarrel', cursive;
      font-size: 3.8rem;
      font-weight: 400;
      background: linear-gradient(135deg, #FFDDFF, #ff9acb, #ca9eff, #7cd9ff);
      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 2px;
      animation: shimmerFlow 8s infinite alternate;
      filter: drop-shadow(0 5px 20px rgba(255, 80, 160, 0.3));
    }
    @keyframes shimmerFlow {
      0% { background-position: 0% 30%; }
      100% { background-position: 100% 70%; }
    }

    .sub {
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: rgba(255, 235, 255, 0.75);
      text-transform: uppercase;
      margin-top: 0.3rem;
      font-weight: 300;
    }

    /* SINGLE LYRIC LINE — Lovers Quarrel font for romantic feel */
    .lyrics-area {
      min-height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 1rem 0;
    }
    .lyrics {
      width: 100%;
      text-align: center;
      padding: 0.5rem;
    }
    .current-lyric {
      font-family: 'Lovers Quarrel', cursive;
      font-size: clamp(2.8rem, 9vw, 4.8rem);
      font-weight: 400;
      line-height: 1.2;
      background: linear-gradient(125deg, #FFE6F0, #ffbfdd, #c896ff, #95e0ff);
      background-size: 180% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 25px rgba(255, 80, 180, 0.4);
      transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      animation: gentleGlow 3s infinite alternate;
      letter-spacing: 2px;
      white-space: pre-wrap;
      word-break: break-word;
      display: inline-block;
      max-width: 95%;
    }
    .current-lyric.animate-change {
      animation: lyricPop 0.45s ease-out forwards;
    }
    @keyframes lyricPop {
      0% { opacity: 0.4; transform: scale(0.92) translateY(8px); filter: blur(6px);}
      40% { opacity: 1; transform: scale(1.02) translateY(-2px); filter: blur(0);}
      100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0);}
    }
    @keyframes gentleGlow {
      0% { text-shadow: 0 0 8px rgba(255, 120, 200, 0.2);}
      100% { text-shadow: 0 0 28px rgba(199, 120, 255, 0.5);}
    }

    /* subtle hint but no controls */
    .tap-hint {
      font-size: 0.7rem;
      text-align: center;
      color: rgba(255, 210, 255, 0.55);
      margin-top: 1.2rem;
      letter-spacing: 1px;
    }

    .meta {
      margin-top: 2rem;
      font-size: 0.75rem;
      text-align: center;
      color: #cfb5ff;
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .love-badge {
      background: rgba(255, 100, 150, 0.2);
      padding: 5px 14px;
      border-radius: 60px;
      font-size: 0.7rem;
      backdrop-filter: blur(5px);
    }

    /* floating hearts animation */
    .heart {
      position: fixed;
      pointer-events: none;
      font-size: 1.6rem;
      z-index: 99;
      filter: drop-shadow(0 0 4px #ff66aa);
      animation: floatHeartLove 3s ease-in forwards, swayLove 2.5s infinite alternate;
    }
    @keyframes floatHeartLove {
      0% { transform: translateY(0) scale(0.7); opacity: 0; }
      15% { opacity: 0.9; transform: translateY(-10px) scale(1); }
      90% { opacity: 0.8; }
      100% { transform: translateY(-85vh) scale(0.4); opacity: 0; }
    }
    @keyframes swayLove {
      0% { margin-left: -10px; }
      100% { margin-left: 15px; }
    }

    @media (max-width: 620px) {
      .card { padding: 1.6rem 1.2rem; border-radius: 2rem; }
      .title { font-size: 2.8rem; }
      .current-lyric { font-size: 2.4rem; }
    }

    /* hidden audio */
    audio {
      display: none;
    }
  </style>
</head>
<body>
<div class="bg-orbs">
  <div class="orb orb--one"></div>
  <div class="orb orb--two"></div>
  <div class="orb orb--three"></div>
</div>
<canvas id="particles"></canvas>

<main class="stage">
  <div class="card">
    <div class="header">
      <h1 class="title">For Charifa</h1>
      <div class="sub">éternellement, mon cœur</div>
    </div>

    <!-- single lyric line display -->
    <div class="lyrics-area">
      <div class="lyrics">
        <div id="currentLyric" class="current-lyric">💖 aji aji aji 💖</div>
      </div>
    </div>
    <div class="tap-hint">
      ✨ touch the lyrics to restart the line ✨
    </div>
    <div class="meta">
      <div class="love-badge">∞ infinite loop ∞</div>
      <div class="love-badge">🌸 always for you, charifa 🌸</div>
    </div>
  </div>
</main>

<audio id="audio" src="music_hW4kzrrn.mp3" preload="metadata" crossorigin="anonymous" loop></audio>

<script>
  (function(){
    // DOM elements
    const audio = document.getElementById('audio');
    const currentLyricEl = document.getElementById('currentLyric');
    
    // LYRICS — lines with timestamps, empty placeholders become empty string '' (nothing visible)
    const RAW_LYRICS = `[00:00.00] ❤️ aji aji aji ❤️
[00:01.70]
[00:03.00] 💕 chofi ma sra biya 💕
[00:04.70]
[00:07.00] ✨ bom bom bom bom ✨
[00:09.00]
[00:09.50] 💫 mnk ma jani noum 💫
[00:11.00] 🌹 aji 3ndi ntsam7o 🌹
[00:13.00] 💗 o ya k7lat l3youn 💗
[00:14.00] ❤️ bom bom bom ❤️
[00:16.00]`;

    let parsedLyrics = [];        // array of {time: number, text: string}
    let currentLineIndex = -1;
    let animationFrameId = null;
    let userInteracted = false;

    // parse LRC: convert to timed entries, empty lines become empty string ''
    function parseLRC(text) {
      const lines = text.split(/\r?\n/).map(l => l.trim());
      const result = [];
      const timeRegex = /\[(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?\]/g;
      for (const line of lines) {
        if (line === '') continue;
        let match;
        const times = [];
        while ((match = timeRegex.exec(line)) !== null) {
          const mins = parseInt(match[1], 10);
          const secs = parseInt(match[2], 10);
          const ms = match[3] ? parseInt((match[3] + '00').slice(0, 3), 10) : 0;
          times.push(mins * 60 + secs + ms / 1000);
        }
        let pureText = line.replace(timeRegex, '').trim();
        // If after removing timestamps the text is empty, we set it to empty string '' (NOT placeholder)
        if (pureText === '') pureText = '';
        if (times.length) {
          for (const t of times) {
            result.push({ time: t, text: pureText });
          }
        } else {
          result.push({ time: null, text: pureText });
        }
      }
      // sort by time, null times at end (rarely used)
      result.sort((a,b) => {
        if (a.time === null && b.time === null) return 0;
        if (a.time === null) return 1;
        if (b.time === null) return -1;
        return a.time - b.time;
      });
      // remove duplicate times if any
      const unique = [];
      for(let i=0; i<result.length; i++) {
        if(i>0 && result[i].time !== null && result[i].time === result[i-1].time) continue;
        unique.push(result[i]);
      }
      return unique;
    }

    // display a specific line index with animation
    function displayLineByIndex(index) {
      if (!parsedLyrics.length) return;
      if (index < 0) index = 0;
      if (index >= parsedLyrics.length) index = parsedLyrics.length - 1;
      const line = parsedLyrics[index];
      let displayText = line.text;
      // if text is exactly empty string, we display a non-breaking space to keep height consistent but invisible
      if (displayText === '') displayText = '\u00A0';  // invisible but preserves layout (no "~~~")
      if (displayText === undefined) displayText = '\u00A0';
      
      // only update if changed
      if (currentLineIndex === index && currentLyricEl.innerText === displayText) return;
      
      currentLyricEl.classList.remove('animate-change');
      void currentLyricEl.offsetWidth; // force reflow
      currentLyricEl.textContent = displayText;
      currentLyricEl.classList.add('animate-change');
      currentLineIndex = index;
    }

    // sync lyrics based on current audio time
    function updateLyricsFromTime(currentTime) {
      if (!parsedLyrics.length) return;
      let activeIdx = -1;
      for (let i = 0; i < parsedLyrics.length; i++) {
        const entry = parsedLyrics[i];
        if (entry.time !== null && entry.time <= currentTime) {
          activeIdx = i;
        } else if (entry.time !== null && entry.time > currentTime) {
          break;
        }
      }
      // handle case where currentTime before first timestamp
      if (activeIdx === -1 && parsedLyrics[0]?.time !== null && currentTime < parsedLyrics[0].time) {
        activeIdx = 0;
      } else if (activeIdx === -1 && parsedLyrics.length) {
        // fallback (should not happen with good timestamps)
        const duration = audio.duration || 18;
        const approx = Math.floor((currentTime / duration) * parsedLyrics.length);
        activeIdx = Math.min(parsedLyrics.length-1, Math.max(0, approx));
      }
      if (activeIdx !== -1 && activeIdx !== currentLineIndex) {
        displayLineByIndex(activeIdx);
      } else if (activeIdx === -1 && currentLineIndex === -1 && parsedLyrics.length) {
        displayLineByIndex(0);
      }
    }

    // RAF loop for syncing
    function startSyncLoop() {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      function tick() {
        if (audio && !audio.paused && !audio.ended) {
          const ct = audio.currentTime;
          updateLyricsFromTime(ct);
        }
        animationFrameId = requestAnimationFrame(tick);
      }
      tick();
    }

    // reset lyrics when audio loops back to 0
    function resetOnLoop() {
      if (audio.currentTime === 0) {
        // force reset to first line
        if (parsedLyrics.length) {
          currentLineIndex = -1;
          displayLineByIndex(0);
        }
      }
    }

    // initialize lyrics display first line
    function initLyricsDisplay() {
      if (parsedLyrics.length) {
        displayLineByIndex(0);
      } else {
        currentLyricEl.textContent = "✨ mon amour ✨";
      }
    }

    // start audio and background elements
    function activateMusicAndLyrics() {
      if (userInteracted) return;
      userInteracted = true;
      
      parsedLyrics = parseLRC(RAW_LYRICS);
      initLyricsDisplay();
      
      // ensure loop is enabled (HTML attribute already sets loop)
      audio.loop = true;
      audio.muted = false;
      audio.play().catch(e => console.log("autoplay blocked, but user tap will start"));
      
      startSyncLoop();
      createFloatingHearts();
      
      // listen for seek events (including natural loop)
      audio.addEventListener('seeked', resetOnLoop);
      // also listen for timeupdate edge when time jumps to 0 after loop end
      audio.addEventListener('timeupdate', () => {
        if (audio.currentTime === 0 && currentLineIndex !== 0) {
          resetOnLoop();
        }
      });
    }
    
    // restart current line when user clicks on lyric (if timestamps exist)
    function restartCurrentLine() {
      if (!parsedLyrics.length || currentLineIndex === -1) return;
      const line = parsedLyrics[currentLineIndex];
      if (line && line.time !== null && isFinite(line.time)) {
        audio.currentTime = line.time;
        if (audio.paused) {
          audio.play().catch(e=>null);
        }
        // re-trigger highlight
        displayLineByIndex(currentLineIndex);
      } else {
        // simple visual feedback
        currentLyricEl.classList.remove('animate-change');
        void currentLyricEl.offsetWidth;
        currentLyricEl.classList.add('animate-change');
      }
    }
    
    // floating hearts background (romantic)
    function createFloatingHearts() {
      const heartsArray = ['❤️', '💖', '💗', '💕', '🌸', '✨', '💫', '🌹', '💘', '💞'];
      setInterval(() => {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.textContent = heartsArray[Math.floor(Math.random() * heartsArray.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.bottom = '-20px';
        heart.style.fontSize = (Math.random() * 18 + 20) + 'px';
        heart.style.opacity = Math.random() * 0.6 + 0.3;
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 3200);
      }, 550);
    }
    
    // ========== particle background ==========
    const canvas = document.getElementById('particles');
    let ctx = canvas.getContext('2d');
    let w, h, particlesArray = [];
    function resizeCanvas() {
      w = canvas.width = window.innerWidth * devicePixelRatio;
      h = canvas.height = window.innerHeight * devicePixelRatio;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(devicePixelRatio, devicePixelRatio);
      initParticles();
    }
    function initParticles() {
      const count = Math.min(110, Math.floor((window.innerWidth + window.innerHeight) / 16));
      particlesArray = [];
      for (let i = 0; i < count; i++) {
        particlesArray.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          radius: Math.random() * 2.2 + 0.8,
          vx: (Math.random() - 0.5) * 0.3,
          vy: -Math.random() * 0.4 - 0.1,
          alpha: Math.random() * 0.5 + 0.2,
        });
      }
    }
    function drawParticles() {
      if (!ctx) return;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      for (let p of particlesArray) {
        p.x += p.vx;
        p.y += p.vy;
        if (p.y < -10) { p.y = window.innerHeight + 8; p.x = Math.random() * window.innerWidth; }
        if (p.x < -15) p.x = window.innerWidth + 10;
        if (p.x > window.innerWidth + 15) p.x = -10;
        ctx.beginPath();
        const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 8);
        gradient.addColorStop(0, `rgba(255, 200, 240, ${p.alpha * 0.8})`);
        gradient.addColorStop(1, `rgba(180, 100, 255, 0)`);
        ctx.fillStyle = gradient;
        ctx.arc(p.x, p.y, p.radius * 4, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(drawParticles);
    }
    window.addEventListener('resize', () => { resizeCanvas(); initParticles(); });
    resizeCanvas();
    initParticles();
    drawParticles();
    
    // initial load lyrics (without audio playing yet)
    parsedLyrics = parseLRC(RAW_LYRICS);
    initLyricsDisplay();
    
    // attach click on lyric to restart line
    currentLyricEl.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!userInteracted) {
        activateMusicAndLyrics();
      } else {
        restartCurrentLine();
      }
    });
    
    // first user interaction anywhere to start music and enable loop
    function firstGlobalInteraction() {
      if (!userInteracted) {
        activateMusicAndLyrics();
      }
      document.removeEventListener('click', firstGlobalInteraction);
      document.removeEventListener('touchstart', firstGlobalInteraction);
    }
    document.addEventListener('click', firstGlobalInteraction);
    document.addEventListener('touchstart', firstGlobalInteraction);
    
    // ensure audio.loop is set (already in HTML)
    audio.loop = true;
    
    // pre-warm loop reset
    audio.addEventListener('seeked', resetOnLoop);
    audio.addEventListener('timeupdate', () => {
      if (audio.currentTime === 0 && currentLineIndex !== 0 && userInteracted) {
        resetOnLoop();
      }
    });
  })();
</script>
</body>
</html>
